<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FreeLLMAPI Gateway">
  <defs>
    <linearGradient id="flm-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="flm-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- three upstream lanes converging into one gateway -->
  <g stroke="url(#flm-line)" stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M6 14 L24 32"/>
    <path d="M6 32 L24 32"/>
    <path d="M6 50 L24 32"/>
  </g>

  <!-- gateway body: a rounded funnel node -->
  <rect x="24" y="21" width="16" height="22" rx="6" fill="url(#flm-body)"/>
  <circle cx="32" cy="32" r="3" fill="#0b1220" opacity="0.55"/>

  <!-- single downstream trunk -->
  <g stroke="url(#flm-line)" stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M40 32 L58 32"/>
  </g>
  <circle cx="58" cy="32" r="3.4" fill="#22d3ee"/>
</svg>
